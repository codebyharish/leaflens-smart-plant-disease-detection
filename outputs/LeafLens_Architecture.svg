<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#0d3d29"/><stop offset="1" stop-color="#22764a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#174a2d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b8d5b"/></marker>
    <style>.title{font:700 42px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#d9efe0}.box{fill:#fff;stroke:#d8e8d8;stroke-width:2}.head{font:700 23px Arial,sans-serif;fill:#173b26}.copy{font:400 16px Arial,sans-serif;fill:#58705f}.tag{font:700 14px Arial,sans-serif;fill:#217145;letter-spacing:1px}.arrow{stroke:#4b8d5b;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="#f4f8f2"/>
  <rect x="55" y="45" width="1490" height="145" rx="30" fill="url(#hero)"/>
  <text x="105" y="111" class="title">LeafLens — Smart Plant Disease Detection</text>
  <text x="105" y="151" class="sub">End-to-end deep-learning pipeline for crop, disease, severity, and action guidance</text>
  <g filter="url(#shadow)">
    <rect class="box" x="85" y="300" width="245" height="205" rx="22"/>
    <text x="115" y="343" class="tag">INPUT</text><text x="115" y="381" class="head">Leaf image upload</text>
    <text x="115" y="414" class="copy">JPG / PNG / WEBP</text><text x="115" y="440" class="copy">Crop selection or</text><text x="115" y="464" class="copy">automatic detection</text>
    <rect class="box" x="420" y="300" width="245" height="205" rx="22"/>
    <text x="450" y="343" class="tag">PREPROCESSING</text><text x="450" y="381" class="head">Image preparation</text>
    <text x="450" y="414" class="copy">Resize to 224 × 224</text><text x="450" y="440" class="copy">RGB conversion</text><text x="450" y="464" class="copy">ImageNet normalization</text>
    <rect class="box" x="755" y="278" width="300" height="250" rx="22" stroke="#75b77e" stroke-width="3"/>
    <text x="785" y="323" class="tag">NEURAL NETWORK</text><text x="785" y="365" class="head">ConvNeXt-Tiny</text>
    <text x="785" y="400" class="copy">ImageNet transfer learning</text><text x="785" y="426" class="copy">Fine-tuned on PlantVillage</text><text x="785" y="452" class="copy">38 crop-condition classes</text><text x="785" y="484" class="copy">Softmax confidence score</text>
    <rect class="box" x="1145" y="300" width="335" height="205" rx="22"/>
    <text x="1175" y="343" class="tag">MODEL OUTPUT</text><text x="1175" y="381" class="head">Disease classification</text>
    <text x="1175" y="414" class="copy">Crop type + disease / healthy</text><text x="1175" y="440" class="copy">Top alternative predictions</text><text x="1175" y="464" class="copy">Confidence assessment</text>
  </g>
  <path class="arrow" d="M330 402H415"/><path class="arrow" d="M665 402H750"/><path class="arrow" d="M1055 402H1140"/>
  <path class="arrow" d="M900 530V605H555V655"/><path class="arrow" d="M900 530V605H1125V655"/>
  <g filter="url(#shadow)">
    <rect class="box" x="265" y="660" width="410" height="170" rx="22"/>
    <text x="295" y="703" class="tag">VISIBLE-SEVERITY SCREEN</text><text x="295" y="741" class="head">HSV lesion-area estimation</text>
    <text x="295" y="774" class="copy">Leaf mask + discolouration overlay</text><text x="295" y="800" class="copy">Low · Moderate · High · Critical</text>
    <rect class="box" x="925" y="660" width="410" height="170" rx="22"/>
    <text x="955" y="703" class="tag">DECISION SUPPORT</text><text x="955" y="741" class="head">Farmer-friendly guidance</text>
    <text x="955" y="774" class="copy">Symptoms · spread · immediate actions</text><text x="955" y="800" class="copy">Prevention · safe treatment options</text>
  </g>
  <path class="arrow" d="M675 745H915"/>
  <text x="800" y="875" text-anchor="middle" class="copy">Web interface: Flask + HTML/CSS/JavaScript  •  Training: PyTorch + CUDA</text>
</svg>
